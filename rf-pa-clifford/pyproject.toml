[project]
name = "rfpa-clifford"
version = "0.1.0"
description = "RF power amplifier behavioural modelling with Clifford algebras"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
logging = ["wandb>=0.17"]
plots = ["matplotlib>=3.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
